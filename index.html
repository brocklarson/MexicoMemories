<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mexico Memories</title>
  <meta name="description" content="Read and share memories from our events.">

  <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
  <script>
    try {
      var theme = localStorage.getItem('theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e6a'/%3E%3Cpath d='M10 22V10h2.4l3.6 6 3.6-6H22v12h-2.4v-7.6L16 20.4l-3.6-6V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-state="loading">
  <header class="topbar" id="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open events list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">Mexico Memories</a>

    <form class="search" id="search-form" role="search">
      <button type="button" class="icon-btn search-close" id="search-close" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <label class="visually-hidden" for="search-input">Search memories</label>
        <input id="search-input" type="search" placeholder="Search memories" autocomplete="off" enterkeyhint="search">
      </div>
    </form>

    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="search-open" aria-label="Search memories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
      <details class="menu user-menu" id="user-menu">
        <summary class="icon-btn" aria-label="Account menu">
          <span class="menu-dot" id="requests-dot" hidden></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg>
        </summary>
        <div class="menu-list">
          <p class="menu-heading" id="user-name"></p>
          <a href="#/account" id="account-link">Account settings</a>
          <a href="#/requests" id="requests-link" hidden>Review requests <span class="count-badge" id="requests-count"></span></a>
          <button type="button" id="sign-out">Sign out</button>
        </div>
      </details>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Events">
      <div class="sidebar-head">
        <div class="sidebar-tools">
          <button type="button" class="icon-btn tool-btn" id="add-event" aria-label="Add event" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" class="icon-btn tool-btn" id="filter-toggle" aria-expanded="false" aria-controls="event-filter" aria-label="Filter events" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
            <span class="filter-badge" id="filter-status" hidden></span>
          </button>
        </div>
      </div>
      <div class="filter" id="event-filter" hidden>
        <p class="filter-help">Choose which events to show.</p>
        <ul class="filter-list" id="filter-list"></ul>
        <button type="button" class="link-btn" id="filter-reset" hidden>Show all events</button>
      </div>
      <ul class="event-list" id="event-list"></ul>
    </nav>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main" tabindex="-1"><p class="empty">Loading&hellip;</p></main>
  </div>

  <dialog id="memory-dialog" aria-labelledby="memory-dialog-title">
    <form id="memory-form" class="dialog-form">
      <h2 id="memory-dialog-title">Add a memory</h2>
      <p class="dialog-sub" id="memory-dialog-event"></p>
      <label class="field-label" for="memory-text">Your memory</label>
      <textarea id="memory-text" name="text" rows="6" required placeholder="What do you remember about it?"></textarea>
      <p class="counter" id="memory-counter"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="memory-cancel">Cancel</button>
        <button type="submit" class="btn primary">Add memory</button>
      </div>
    </form>
  </dialog>

  <dialog id="event-dialog" aria-labelledby="event-dialog-title">
    <form id="event-form" class="dialog-form event-form">
      <h2 id="event-dialog-title">Add event</h2>

      <div class="field">
        <label class="required" for="event-name">Name</label>
        <input id="event-name" name="name" type="text" required maxlength="100" autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field">
          <label class="required" for="event-start">Start date</label>
          <input id="event-start" name="start" type="date" required>
        </div>
        <div class="field">
          <label class="required" for="event-end">End date</label>
          <input id="event-end" name="end" type="date" required>
        </div>
      </div>

      <div class="field">
        <label for="event-family">Family</label>
        <input id="event-family" name="family" type="text" maxlength="200" autocomplete="off">
      </div>

      <div class="field">
        <label for="event-album">Photo album link</label>
        <input id="event-album" name="album" type="url" placeholder="https://" autocomplete="off">
      </div>

      <div class="field">
        <label for="event-coords">Map location</label>
        <input id="event-coords" name="coords" type="text" placeholder="39.7392, -104.9903" autocomplete="off">
      </div>

      <div class="field">
        <label for="event-place">Place name</label>
        <input id="event-place" name="place" type="text" maxlength="100" autocomplete="off">
      </div>

      <p class="form-note"><span class="req" aria-hidden="true">*</span> Required</p>
      <p class="form-error" id="event-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="event-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="event-submit">Add event</button>
      </div>
    </form>
  </dialog>

  <dialog id="request-dialog" aria-labelledby="request-dialog-title">
    <form id="request-form" class="dialog-form">
      <h2 id="request-dialog-title"></h2>
      <p class="dialog-sub">The admin reviews every request. Nothing changes until it is approved.</p>
      <blockquote class="request-original" id="request-original" hidden></blockquote>
      <label class="field-label" for="request-text" id="request-label"></label>
      <textarea id="request-text" name="text"></textarea>
      <p class="counter" id="request-counter"></p>
      <p class="form-error" id="request-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="request-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="request-submit">Send request</button>
      </div>
    </form>
  </dialog>

  <p class="visually-hidden" id="search-status" role="status"></p>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
